<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client book</title>
<meta name="robots" content="noindex, nofollow">
<script>
/* =====================================================================
   SETTINGS: fill these two in once. See README.md, step 4.
   Both come from Supabase: Project Settings > API Keys.
   Use the PUBLISHABLE key (starts with sb_publishable_).
   Never put the secret key (sb_secret_) here: this page is public.
   ===================================================================== */
window.CLIENT_BOOK_CONFIG = {
  supabaseUrl: "https://YOUR-PROJECT-ID.supabase.co",
  supabaseKey: "sb_publishable_PASTE-YOUR-KEY-HERE"
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
:root{
  --ground:#ECEFF2; --surface:#F9FAFB; --ink:#16233A; --muted:#5A6577; --line:#CBD2DB;
  --accent:#7A2334; --accent-ink:#FFFFFF; --ok:#2F6B4A; --due:#8F5F0A; --chip:#DDE3EA;
  --sans:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111722; --surface:#182131; --ink:#E6EAF0; --muted:#98A3B5; --line:#2C3850;
    --accent:#DD93A2; --accent-ink:#1F0C11; --ok:#7FC49B; --due:#E0B25C; --chip:#22304A;
  }
}
:root[data-theme="dark"]{
  --ground:#111722; --surface:#182131; --ink:#E6EAF0; --muted:#98A3B5; --line:#2C3850;
  --accent:#DD93A2; --accent-ink:#1F0C11; --ok:#7FC49B; --due:#E0B25C; --chip:#22304A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
[hidden]{display:none !important}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:28px}
.brand{font-family:var(--serif);font-size:24px;line-height:1.1;padding:0 8px}
.brand small{display:block;font:400 13px/1.4 var(--sans);color:var(--muted);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;font-weight:500;color:var(--muted)}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--chip);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .n{font-size:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
main{padding:28px 32px 56px;min-width:0}
.notice{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:14px;margin-bottom:20px;max-width:78ch}
.head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;justify-content:space-between;margin-bottom:20px}
.head h1{font:400 30px/1.15 var(--serif)}
.head p{color:var(--muted);max-width:66ch;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding:8px 8px}
.btn.quiet:hover{color:var(--ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--chip)}
.tag.mtm{background:var(--accent);color:var(--accent-ink)}
.tag.ok{color:var(--ok);background:none;border:1px solid currentColor}
.tag.off{color:var(--muted);background:none;border:1px solid var(--line)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:500;font-size:14px}
.check input{margin-top:4px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* customers */
.book{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px;align-items:start}
.list{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.list button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;width:100%;border-bottom:1px solid var(--line)}
.list button:last-child{border-bottom:0}
.list button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent);background:var(--ground)}
.list button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.list .nm{font-family:var(--serif);font-size:17px;line-height:1.25}
.list .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
.empty{padding:32px 20px;color:var(--muted);text-align:left}
.empty .row{margin-top:12px}
.profile{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:24px}
.profile h2{font:400 28px/1.15 var(--serif)}
.contact{color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0;padding:16px 0;border-block:1px solid var(--line)}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{margin:0;font-size:19px;font-weight:600}
.profile h3{font:600 15px/1.3 var(--sans);margin:22px 0 8px}
.kv{white-space:pre-wrap}
.order{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.order .what{font-weight:600}
.order .meta{font-size:13px;color:var(--muted);grid-column:1/-1}
.back{display:none}

/* stitch tracker: one knot per email along a basting line */
.track{margin:10px 0 2px}
.order .track{grid-column:1/-1}
.stitch{list-style:none;margin:0 0 5px;padding:0;display:flex;justify-content:space-between;position:relative;max-width:250px}
.stitch::before{content:"";position:absolute;left:8px;right:8px;top:8px;border-top:2px dashed var(--line)}
.stitch li{position:relative}
.knot{display:block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative}
.knot::after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:2px;
  background:radial-gradient(circle,currentColor 1px,transparent 1.2px) 0 0/4px 2px;color:var(--line)}
.stitch .sent .knot{background:var(--ok);border-color:var(--ok)}
.stitch .sent .knot::after{color:var(--surface)}
.stitch .due .knot{border-color:var(--due)}
.stitch .due .knot::after{color:var(--due)}
.stitch .skip .knot{border-style:dotted}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stline{font-size:12.5px;color:var(--muted)}
.stline.due{color:var(--due);font-weight:600}
.flag{font-size:12.5px;font-weight:600;color:var(--due);margin-top:4px}
.order .flag{grid-column:1/-1}

/* board */
.boardwrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-template-columns:repeat(6,minmax(214px,1fr));gap:14px;min-width:1360px}
.col h2{font:600 15px/1.3 var(--sans);display:flex;justify-content:space-between;padding:0 2px 8px;border-bottom:2px solid var(--ink);margin-bottom:10px}
.col h2 span{color:var(--muted);font-weight:500}
.col .sends{font-size:13px;color:var(--muted);margin:-4px 2px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.card .nm{font-family:var(--serif);font-size:17px;line-height:1.25}
.card .it{font-size:14px}
.card .dt{font-size:13px;color:var(--muted)}
.card .row{margin-top:10px;gap:6px}
.col .none{font-size:13px;color:var(--muted);padding:8px 2px}

/* segments */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:20px}
.panel h2{font:600 16px/1.3 var(--sans);margin-bottom:12px}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.count{font:400 26px/1.2 var(--serif);margin:6px 0 8px}
.people{max-height:230px;overflow:auto;border-top:1px solid var(--line);font-size:14px}
.people div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.people span:last-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.preview{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:12px 0;font-size:14px;white-space:pre-wrap;color:var(--muted)}
.hist{font-size:14px}
.hist div{padding:8px 0;border-top:1px solid var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:24px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,16,28,.5)}
dialog h2{font:400 22px/1.2 var(--serif);margin-bottom:14px}
dialog .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-weight:500;font-size:14px;max-width:calc(100vw - 32px);z-index:10}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px 10px;gap:10px}
  .brand{font-size:20px}.brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:7px 10px}
  main{padding:20px 16px 48px}
  .book,.two{grid-template-columns:1fr}
  .book.open .listside{display:none}
  .book:not(.open) .profileside{display:none}
  .back{display:inline-block;margin-bottom:10px}
  .profile{padding:18px}
  .filters,.grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ dialog[open]{animation:pop .14s ease-out} @keyframes pop{from{opacity:0;transform:translateY(6px)}} }
/* to do */
.todo-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-bottom:22px}
.todo-bar .field{margin:0;min-width:230px}
.todo-bar p{color:var(--muted);font-size:14px;max-width:46ch}
.tasks{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:24px;overflow:hidden}
.tasks h2{font:600 15px/1.3 var(--sans);padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.tasks h2 span{color:var(--muted);font-weight:500}
.tasks .intro{padding:10px 16px 0;font-size:13px;color:var(--muted)}
.task{display:grid;grid-template-columns:minmax(0,1fr) 180px minmax(0,auto);gap:8px 16px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.tasks h2+.task,.tasks .intro+.task{border-top:0}
.task .nm{font-family:var(--serif);font-size:17px;line-height:1.25}
.task .what{font-size:14px}
.task .when{font-size:13px;color:var(--muted)}
.task .when.late{color:var(--due);font-weight:600}
.task select{padding:5px 8px;font-size:13px}
.task .row{justify-content:flex-end;gap:6px}
.tasks .none{padding:14px 16px;color:var(--muted);font-size:14px}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--accent-ink)}
.owner{font-size:13px;color:var(--muted);margin-left:4px}
.staffrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:820px){.task{grid-template-columns:1fr}.task .row{justify-content:flex-start}}
.rail .account{margin-top:auto;padding:0 8px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rail .account .btn{margin-top:6px}
.locked .nav,.locked .account{display:none}
.gate{max-width:420px;margin:8vh auto 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:28px}
.gate h1{font:400 28px/1.15 var(--serif);margin-bottom:6px}
.gate p{color:var(--muted);margin-bottom:16px}
.gate .msg{color:var(--accent);font-weight:500;margin:12px 0 0}
.gate .msg:empty{display:none}
.gate code{font-size:13px;background:var(--chip);padding:1px 5px;border-radius:4px}
.gate ol{padding-left:20px;margin:0 0 12px;color:var(--ink)}
.gate li{margin-bottom:6px}
@media (max-width:820px){.rail .account{margin-top:0;padding:0}.rail .account br{display:none}.rail .account strong{margin:0 8px 0 4px}.rail .account .btn{margin-top:0}.gate{margin-top:20px;padding:20px}}
</style>
</head>
<body>
<div class="app locked" id="app">
  <aside class="rail">
    <div class="brand">Client book<small>Customers, orders and made-to-measure follow-up</small></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="account" id="account"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
var STAGES=[
  {id:"fitting",label:"Fitting booked",email:"fitting",emailLabel:"Fitting reminder",when:"due the day before the fitting"},
  {id:"ordered",label:"Order placed",email:"thanks",emailLabel:"Thank you",when:"sent when the order is placed"},
  {id:"halfway",label:"Halfway",email:"halfway",emailLabel:"Halfway there",when:"sent when the order moves here"},
  {id:"almost",label:"Almost ready",email:"almost",emailLabel:"Almost there",when:"sent when the order moves here"},
  {id:"ready",label:"Ready to collect",email:"ready",emailLabel:"Ready to collect",when:"sent when the order moves here"},
  {id:"collected",label:"Collected",email:"care",emailLabel:"Care and thanks",when:"due two weeks after collection"}
];
var NUDGES={winback:"Win-back",reorder:"Shirt reorder"};
var STUCK={ordered:21,halfway:21,almost:14,fitting:14,ready:10};
var CATS=["Suit","Jacket","Trousers","Shirt","Outerwear","Knitwear","Shoes","Accessories","Other"];
var DEFAULT_TPL={
  shopName:"Your boutique",
  thanks:{subject:"Thank you for your order, {{first_name}}",body:"Hi {{first_name}},\n\nThank you for ordering your {{item}} with us. Your measurements are on file and the order has gone to the workshop.\n\nWe expect it to be ready around {{due_date}}, and we will write again when it is halfway.\n\nBest regards,\n{{shop_name}}"},
  halfway:{subject:"Your {{item}} is halfway there",body:"Hi {{first_name}},\n\nA short update: your {{item}} has been cut and is now being sewn. Everything is on schedule for {{due_date}}.\n\nBest regards,\n{{shop_name}}"},
  almost:{subject:"Your {{item}} is almost ready",body:"Hi {{first_name}},\n\nYour {{item}} is in its final stage. We will write again in a few days, as soon as it is ready to collect.\n\nBest regards,\n{{shop_name}}"},
  fitting:{subject:"Your fitting on {{fitting_date}}",body:"Hi {{first_name}},\n\nA reminder that your fitting for the {{item}} is on {{fitting_date}} at {{fitting_time}}. Please wear a dress shirt and the shoes you plan to wear with it.\n\nIf the time no longer suits you, reply to this email and we will find another.\n\nBest regards,\n{{shop_name}}"},
  ready:{subject:"Your {{item}} is ready to collect",body:"Hi {{first_name}},\n\nYour {{item}} is finished and waiting for you in the shop. Come by whenever suits you during opening hours, and allow a few minutes to try it on so we can check the fit together.\n\nBest regards,\n{{shop_name}}"},
  care:{subject:"How is your {{item}}?",body:"Hi {{first_name}},\n\nYou have had your {{item}} for a couple of weeks now and we hope it is serving you well. A few care notes: hang it on a wide hanger, brush it after wear, and let it rest a day between wears.\n\nIf anything needs adjusting, bring it in. And if you are happy with it, a short review would mean a lot to us.\n\nBest regards,\n{{shop_name}}"},
  winback:{subject:"It has been a while, {{first_name}}",body:"Hi {{first_name}},\n\nIt has been some time since we last saw you. New cloth and new pieces have arrived since then, and we would be glad to show you.\n\nBest regards,\n{{shop_name}}"},
  reorder:{subject:"Time for fresh shirts, {{first_name}}?",body:"Hi {{first_name}},\n\nIt has been a while since your last shirts from us. Your sizes are on file, so reordering takes a minute, in the shop or by replying to this email.\n\nBest regards,\n{{shop_name}}"}
};
var TPL_KEYS=["fitting","thanks","halfway","almost","ready","care","winback","reorder"];
var STAFF_EDITABLE=false;
var S={view:"todo",staff:[],me:null,todoFor:null,customers:[],campaigns:[],tpl:DEFAULT_TPL,ready:false,memory:false,selected:null,q:"",chip:"all",
  seg:{type:"any",cat:"any",channel:"any",recency:"any",minSpend:"",tag:"",consent:true},imp:null};
var sb=null,channel=null,CFG=window.CLIENT_BOOK_CONFIG||{};
var $=function(s,r){return (r||document).querySelector(s)};
var main=$("#main"),dlg=$("#dlg");

/* ---------- helpers ---------- */
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(p){return p+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function today(){var d=new Date();return iso(d)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function fmtDate(s,short){if(!s)return "";var d=new Date(s+"T12:00:00");if(isNaN(d))return s;
  return d.toLocaleDateString("en-GB",short?{day:"numeric",month:"short"}:{day:"numeric",month:"short",year:"numeric"})}
function kr(n){return "kr "+Math.round(Number(n)||0).toLocaleString("nb-NO")}
function monthsAgo(s){return (Date.now()-new Date(s+"T12:00:00").getTime())/(1000*60*60*24*30.44)}
function byId(id){return S.customers.find(function(c){return c.id===id})}
function orders(c){return c.orders||[]}
function spend(c){return orders(c).reduce(function(t,o){return t+(Number(o.amount)||0)},0)}
function lastOrder(c){return orders(c).map(function(o){return o.date}).sort().pop()||""}
function firstName(c){return String(c.name||"").trim().split(/\s+/)[0]||"there"}
function merge(t,ctx){return String(t||"").replace(/\{\{\s*(\w+)\s*\}\}/g,function(m,k){return ctx[k]!=null?ctx[k]:m})}
function toast(msg){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function days(n){return n+(n===1?" day":" days")}
function stageIndex(o){return STAGES.findIndex(function(s){return s.id===o.stage})}
function isActive(o){return o.type==="mtm"&&!!o.stage&&(o.stage!=="collected"||(!!o.collectedOn&&!(o.emails&&o.emails.care)&&!(o.skipped&&o.skipped.care)))}
function emailState(o,i){
  var s=STAGES[i],si=stageIndex(o);
  if(o.emails&&o.emails[s.email])return "sent";
  if(o.skipped&&o.skipped[s.email])return "skip";
  if(si<i)return "wait";if(si>i)return "skip";
  if(s.id==="fitting"&&o.fitting&&o.fitting.date&&today()<addDays(o.fitting.date,-1))return "wait";
  if(s.id==="collected"){if(!o.collectedOn)return "na";if(today()<addDays(o.collectedOn,14))return "wait"}
  return "due"}
function stageSince(o){if(o.stageSince)return o.stageSince;var d=[o.date];if(o.emails)Object.keys(o.emails).forEach(function(k){d.push(o.emails[k])});return d.sort().pop()}
function flags(o){
  var f=[],t=today();if(o.stage==="collected"||!STUCK[o.stage])return f;
  if(o.stage==="fitting"){if(o.fitting&&o.fitting.date&&o.fitting.date<t)f.push("The fitting on "+fmtDate(o.fitting.date,true)+" has passed");else if(!o.fitting||!o.fitting.date)f.push("No fitting date set");return f}
  if(o.due&&t>o.due)f.push(days(daysBetween(o.due,t))+" past the expected date");
  var d=daysBetween(stageSince(o),t);if(d>STUCK[o.stage])f.push(days(d)+" in this stage");
  if(o.occasion){var left=daysBetween(t,o.occasion),gap=o.due?daysBetween(o.due,o.occasion):99;
    if(left<0)f.push("The event on "+fmtDate(o.occasion,true)+" has passed");
    else if(gap<7)f.push(gap<0?"Expected after the event on "+fmtDate(o.occasion,true):"Expected only "+days(gap)+" before the event on "+fmtDate(o.occasion,true));
    else if(left<=14)f.push("Event in "+days(left))}
  return f}
function flagsHtml(o){return flags(o).map(function(x){return '<div class="flag">'+esc(x)+'</div>'}).join("")}
function mailCtx(c,o){return {first_name:firstName(c),item:o?o.item:"",due_date:(o&&fmtDate(o.due))||"the agreed date",
  fitting_date:(o&&o.fitting&&fmtDate(o.fitting.date))||"the agreed day",fitting_time:(o&&o.fitting&&o.fitting.time)||"the agreed time",shop_name:S.tpl.shopName||DEFAULT_TPL.shopName}}
function typeLabel(t){return t==="mtm"?"Made to measure":"Ready to wear"}
function channelLabel(c){return c==="online"?"Online":"In store"}

/* ---------- storage (Supabase) ---------- */
var chain=Promise.resolve();
function queue(fn){var p=chain.then(fn);chain=p.catch(function(){});return p}
function run(q){return Promise.resolve(q).then(function(r){if(r&&r.error)throw r.error;return r?r.data:null})}
function dbErr(e){
  var code=String(e&&e.code||""),msg=String(e&&e.message||"");
  if(code==="42501"||/row-level security|permission denied/i.test(msg))toast("Your account is not allowed to change the client book, so that change was not saved.");
  else if(/jwt|expired|not authenticated/i.test(msg)){toast("Your sign-in has expired. Sign in again.");sb.auth.signOut()}
  else toast("That change could not be saved. Check the internet connection and try again.")}
function rowToObj(r){return Object.assign({},r.data||{},{id:r.id})}
function putLocal(list,obj){var i=list.findIndex(function(x){return x.id===obj.id});if(i<0)list.push(obj);else list[i]=obj}
function dropLocal(list,id){var i=list.findIndex(function(x){return x.id===id});if(i>=0)list.splice(i,1)}
function sortCampaigns(){S.campaigns.sort(function(a,b){return a.date<b.date?1:-1})}
function toRow(c){var b=clone(c),id=b.id;delete b.id;return {id:id,data:b}}
function saveCustomer(c){
  var row=toRow(c);
  return queue(function(){return run(sb.from("customers").upsert(row))})
    .then(function(){putLocal(S.customers,clone(c));refresh();return true},function(e){dbErr(e);return false})}
function saveCustomers(list){
  return queue(function(){return run(sb.from("customers").upsert(list.map(toRow)))})
    .then(function(){list.forEach(function(c){putLocal(S.customers,clone(c))});refresh();return true},function(e){dbErr(e);return false})}
function removeCustomer(id){
  return queue(function(){return run(sb.from("customers").delete().eq("id",id))})
    .then(function(){dropLocal(S.customers,id);refresh();return true},function(e){dbErr(e);return false})}
function saveTemplates(t){
  return queue(function(){return run(sb.from("settings").upsert({key:"templates",data:t}))})
    .then(function(){S.tpl=Object.assign(clone(DEFAULT_TPL),t);refresh();return true},function(e){dbErr(e);return false})}
function saveStaff(){toast("Staff are added in Supabase. The README explains how.");return Promise.resolve(false)}
function saveCampaign(k){
  var id=uid("k");
  return queue(function(){return run(sb.from("campaigns").upsert({id:id,data:k}))})
    .then(function(){putLocal(S.campaigns,Object.assign({id:id},k));sortCampaigns();refresh();return true},function(e){dbErr(e);return false})}
function loadAll(table,cols,key){
  var out=[],size=1000;
  function page(from){return run(sb.from(table).select(cols).order(key).range(from,from+size-1))
    .then(function(rows){rows=rows||[];out=out.concat(rows);return rows.length===size?page(from+size):out})}
  return page(0)}
function loadEverything(){
  return Promise.all([loadAll("customers","id,data","id"),loadAll("campaigns","id,data","id"),loadAll("settings","key,data","key"),loadAll("staff","email,name","email")]).then(function(r){
    S.staff=r[3].map(function(x){var e=String(x.email||"").toLowerCase();return {id:e,name:x.name||e}});
    S.customers=r[0].map(rowToObj);S.campaigns=r[1].map(rowToObj);sortCampaigns();
    var t=r[2].find(function(x){return x.key==="templates"});S.tpl=t?Object.assign(clone(DEFAULT_TPL),t.data||{}):DEFAULT_TPL})}
function applyChange(table,p){
  if(!S.ready)return;
  if(table==="settings"){if(p.new&&p.new.key==="templates"){S.tpl=Object.assign(clone(DEFAULT_TPL),p.new.data||{});refresh()}return}
  var list=table==="customers"?S.customers:S.campaigns;
  if(p.eventType==="DELETE"){if(p.old&&p.old.id)dropLocal(list,p.old.id)}
  else if(p.new&&p.new.id)putLocal(list,rowToObj(p.new));
  if(table==="campaigns")sortCampaigns();
  if(S.selected&&!byId(S.selected))S.selected=null;
  refresh()}
function listen(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("client-book");
  ["customers","campaigns","settings"].forEach(function(t){
    channel.on("postgres_changes",{event:"*",schema:"public",table:t},function(p){applyChange(t,p)})});
  channel.subscribe()}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState!=="visible"||!S.ready||dlg.open||S.imp)return;
  loadEverything().then(refresh,function(){})});

var app=$("#app");

function gate(html){lock(true);S.ready=false;main.innerHTML='<div class="gate">'+html+'</div>';var f=main.querySelector("input");if(f)f.focus()}
function gateMsg(t){var m=$("#gateMsg");if(m)m.textContent=t}
function configProblem(){
  var u=String(CFG.supabaseUrl||""),k=String(CFG.supabaseKey||"");

  '<p class="msg" id="gateMsg" role="alert">'+esc(msg||"")+'</p>')}
function showNewPassword(){
  gate('<h1>Choose a new password</h1><p>Use at least 10 characters.</p>'+
  '<form data-form="newpw"><div class="field"><label for="g-npw">New password</label><input type="password" id="g-npw" name="password" autocomplete="new-password" minlength="10" required></div>'+

function showNotStaff(email){
  gate('<h1>No access yet</h1><p>You are signed in as '+esc(email)+', but this address is not on the staff list. Ask the shop owner to add it.</p>'+

function renderAccount(){
  $("#account").innerHTML=S.user?'Signed in as<br><strong>'+esc(S.user)+'</strong><br><button class="btn small" data-act="signout">Sign out</button>':''}
function enter(session){
  var email=session&&session.user&&session.user.email;if(!email){showLogin();return}
  if(S.user===email&&(S.ready||S.loading))return;
  S.user=email;S.me=String(email).toLowerCase();S.loading=true;renderAccount();main.innerHTML='<p class="muted">Opening the client book…</p>';
  run(sb.rpc("is_staff")).then(function(ok){
    if(!ok){S.loading=false;showNotStaff(email);return}
    return loadEverything().then(function(){S.loading=false;S.ready=true;lock(false);listen();renderView()})
  }).catch(function(){S.loading=false;
    gate('<h1>Could not open the client book</h1><p>The database did not answer. Check the internet connection and reload. If it keeps happening, check that the setup script has been run in Supabase.</p><div class="row"><button class="btn" data-act="reload">Reload</button><button class="btn quiet" data-act="signout">Sign out</button></div>')})}
function leave(msg){
  if(channel){sb.removeChannel(channel);channel=null}
  S.user=null;S.me=null;S.staff=[];S.todoFor=null;S.ready=false;S.loading=false;S.customers=[];S.campaigns=[];S.selected=null;S.imp=null;S.tpl=DEFAULT_TPL;
  if(dlg.open)dlg.close();showLogin(msg)}

function boot(){
  renderNav();
  var problem=configProblem();if(problem){showSetup(problem);return}
  if(!window.supabase||!window.supabase.createClient){showSetup("library");return}
  var recovery=/type=recovery/.test(location.hash);
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
  main.innerHTML='<p class="muted">Connecting…</p>';
  sb.auth.onAuthStateChange(function(event,session){
    setTimeout(function(){
      if(event==="PASSWORD_RECOVERY"||(recovery&&session&&(event==="INITIAL_SESSION"||event==="SIGNED_IN"))){recovery=true;S.user=session&&session.user&&session.user.email;renderAccount();showNewPassword();return}
      if(event==="SIGNED_OUT"){leave();return}
      if(event==="INITIAL_SESSION"&&!session){showLogin();return}
      if(session&&!recovery&&(event==="INITIAL_SESSION"||event==="SIGNED_IN"))enter(session);
    },0)});
  boot.done=function(){recovery=false}}

/* ---------- staff and assignment ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function activeStaff(){return S.staff.filter(function(p){return !p.removed})}
function staffName(id){if(!id)return "";var p=S.staff.find(function(x){return x.id===id});return p?((p.name||p.id)+(p.removed?" (former staff)":"")):id}
function staffOptions(cur,blank){
  cur=cur||"";var h=opt("",blank||"Unassigned",cur),seen=false;
  activeStaff().forEach(function(p){if(p.id===cur)seen=true;h+=opt(p.id,p.name||p.id,cur)});
  if(cur&&!seen)h+=opt(cur,staffName(cur),cur);
  return h}
function orderOwner(c,o){return typeof o.owner==="string"?o.owner:(c.owner||"")}
function todoFilter(){
  var f=S.todoFor||lsGet("cb-todo-for")||(S.me?"mine":"all");
  if(f==="mine"&&!S.me)f="all";
  if(f!=="mine"&&f!=="all"&&f!=="none"&&!activeStaff().some(function(p){return p.id===f}))f=S.me?"mine":"all";
  return f}
function forFilter(owner){var f=todoFilter();
  if(f==="all")return true;if(f==="none")return !owner;if(f==="mine")return !owner||owner===S.me;return owner===f}
var selN=0;
function assignSel(scope,c,o,owner){
  if(!activeStaff().length&&!owner)return '<div></div>';
  var id="as"+(++selN);
  return '<div><label class="sr" for="'+id+'">Assigned to</label><select id="'+id+'" data-assign="'+scope+'" data-id="'+esc(c.id)+'"'+(o?' data-oid="'+esc(o.id)+'"':'')+'>'+staffOptions(owner)+'</select></div>'}

/* ---------- to do ---------- */
function taskDate(o,s){
  if(s.id==="fitting"&&o.fitting&&o.fitting.date)return addDays(o.fitting.date,-1);
  if(s.id==="collected"&&o.collectedOn)return addDays(o.collectedOn,14);
  return stageSince(o)}
function emailTasks(){
  var due=[],soon=[],wk=addDays(today(),7);
  S.customers.forEach(function(c){orders(c).forEach(function(o){
    if(!isActive(o))return;
    STAGES.forEach(function(s,i){var st=emailState(o,i),x={c:c,o:o,s:s,date:taskDate(o,s),owner:orderOwner(c,o)};
      if(st==="due")due.push(x);
      else if(st==="wait"&&stageIndex(o)===i&&(s.id==="fitting"||s.id==="collected")&&x.date<=wk)soon.push(x)})})});
  var by=function(a,b){return a.date<b.date?-1:a.date>b.date?1:String(a.c.name).localeCompare(String(b.c.name),"nb")};
  return {due:due.sort(by),soon:soon.sort(by)}}
function todoCount(){
  if(!S.ready)return 0;
  return emailTasks().due.filter(function(x){return forFilter(x.owner)}).length+nudgeList().filter(function(x){return forFilter(x.c.owner||"")}).length}
function weekday(d){var x=new Date(d+"T12:00:00");return isNaN(x)?d:x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function dueText(d){var n=daysBetween(d,today());
  if(n<0)return {text:n===-1?"Due tomorrow":"Due "+weekday(d),late:false};
  if(n===0)return {text:"Due today",late:false};
  return {text:n===1?"Due yesterday":"Due "+fmtDate(d,true)+", "+days(n)+" ago",late:true}}
function mailtoHref(email,subject,body){
  email=String(email||"").trim();
  if(!/^[^\s@,;?&#<>"]+@[^\s@,;?&#<>"]+\.[^\s@,;?&#<>"]+$/.test(email))return "";
  var enc=function(s){return encodeURIComponent(String(s||"").replace(/\r?\n/g,"\r\n"))};
  return "mailto:"+email+"?subject="+enc(subject)+"&body="+enc(body)}
function mailFor(c,key,o){var t=S.tpl[key]||DEFAULT_TPL[key],ctx=mailCtx(c,o||null);return {subject:merge(t.subject,ctx),body:merge(t.body,ctx)}}
function openMailBtn(c,m,cls){var href=mailtoHref(c.email,m.subject,m.body);
  return href?'<a class="btn small'+(cls||"")+'" href="'+esc(href)+'" data-act="opened">Open in mail</a>':''}
function emailTaskRow(x){

function fillTodo(){

  var bar='<div class="todo-bar">'+
    (staff.length||S.me?'<div class="field"><label for="todo-for">Show tasks for</label><select id="todo-for">'+
      (S.me?opt("mine","Me and unassigned",f):"")+opt("all","Everyone",f)+opt("none","Unassigned only",f)+

  var t=emailTasks(),flt=function(x){return forFilter(x.owner)};

  el.innerHTML=bar+
    taskSection("Emails to send",due.map(emailTaskRow),"Nothing to send right now. New emails appear here as orders move along the made-to-measure board.")+

    taskSection("Orders needing attention",att.map(attentionRow),"No orders are late or stuck.")+
    taskSection("Coming up this week",soon.map(soonRow),"No fitting reminders or care emails due in the next seven days.")}

function shellCustomers(){
  main.innerHTML=memoryNote()+
  '<div class="head"><div><h1>Customers</h1><p>Every customer with their in-store and online purchases in one place.</p></div>'+

        orders(x).forEach(function(o){rows.push(base.concat([o.date,o.item,o.category,typeLabel(o.type),channelLabel(o.channel),o.amount]))})});
      offerFile("client-book.csv",toCSV(rows));break;
    case "delSamples":confirmDialog("Remove sample customers","This deletes the sample customers that came with the prototype. Your own records stay.","delSamplesYes","");break;
    case "delSamplesYes":dlg.close();S.selected=null;S.customers.filter(function(x){return x.sample}).reduce(function(p,x){return p.then(function(){return removeCustomer(x.id)})},Promise.resolve()).then(function(){toast("Sample customers removed")});break;
  }});
document.addEventListener("submit",function(e){
  var f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();var v=new FormData(f),c;
  if(f.dataset.form==="signin"){var btn=f.querySelector(".primary");btn.disabled=true;gateMsg("");
    sb.auth.signInWithPassword({email:String(v.get("email")).trim(),password:String(v.get("password"))}).then(function(r){btn.disabled=false;
      if(r.error)gateMsg(/invalid|credentials/i.test(r.error.message)?"That email and password do not match. Check them and try again.":/confirm/i.test(r.error.message)?"This account has not been confirmed yet. Ask the shop owner to confirm it in Supabase.":"Sign-in failed: "+r.error.message)},
      function(){btn.disabled=false;gateMsg("Could not reach the database. Check the internet connection.")});return}
  if(f.dataset.form==="newpw"){var nb=f.querySelector(".primary");nb.disabled=true;
    sb.auth.updateUser({password:String(v.get("password"))}).then(function(r){nb.disabled=false;
      if(r.error){gateMsg("The password was not saved: "+r.error.message);return}
      boot.done();history.replaceState(null,"",location.pathname+location.search);toast("Password saved");
      sb.auth.getSession().then(function(s){enter(s.data.session)})},function(){nb.disabled=false;gateMsg("Could not reach the database. Check the internet connection.")});return}
  if(f.dataset.form==="staff"){var nm=String(v.get("name")).trim();if(!nm)return;
    var list=clone(S.staff),back=list.find(function(x){return x.removed&&String(x.name).toLowerCase()===nm.toLowerCase()});
    if(back)delete back.removed;else list.push({id:uid("p"),name:nm});
    saveStaff(list).then(function(ok){if(ok){f.reset();fillStaffList();$("#st-name").focus()}});return}
  if(f.dataset.form==="customer"){
    var ex=f.dataset.id&&byId(f.dataset.id);
    c=ex?clone(ex):{id:uid("c"),createdAt:today(),source:"manual",orders:[]};
    c.name=String(v.get("name")).trim();c.email=String(v.get("email")).trim();c.phone=String(v.get("phone")).trim();c.consent=!!v.get("consent");
    if(v.has("owner")){if(v.get("owner"))c.owner=String(v.get("owner"));else delete c.owner}
    c.sizes=String(v.get("sizes")).trim();c.notes=String(v.get("notes")).trim();c.tags=String(v.get("tags")).split(",").map(function(t){return t.trim()}).filter(Boolean);
    dlg.close();S.selected=c.id;saveCustomer(c).then(function(ok){if(ok)toast(ex?"Profile saved":"Customer added")});
  }else if(f.dataset.form==="order"){
    c=clone(byId(f.dataset.id));var o={id:uid("o"),date:v.get("date"),item:String(v.get("item")).trim(),category:v.get("category"),type:v.get("type"),channel:v.get("channel"),amount:Math.round(Number(v.get("amount"))||0)};
    if(o.type==="mtm"){o.stage="ordered";o.stageSince=today();o.due=v.get("due")||addDays(o.date,42);o.emails={};if(v.get("occasion"))o.occasion=v.get("occasion");if(v.has("owner")){var ow=String(v.get("owner"));if(ow!==(c.owner||""))o.owner=ow}
      if(v.get("fitDate")){o.stage="fitting";o.fitting={date:v.get("fitDate"),time:String(v.get("fitTime")).trim()||"the agreed time"}}}
    c.orders=orders(c).concat([o]);dlg.close();
    saveCustomer(c).then(function(ok){if(!ok)return;if(o.type!=="mtm")toast("Order added");
      else if(emailState(o,stageIndex(o))==="due")emailDialog(c.id,o.id,o.stage,false);
      else toast("Order added. The fitting reminder is due on "+fmtDate(addDays(o.fitting.date,-1)))});
  }else if(f.dataset.form==="fitting"){
    var ft={date:v.get("date"),time:String(v.get("time")).trim()},fd=f.dataset;dlg.close();
    var co=byId(fd.id),cur=co&&orders(co).find(function(x){return x.id===fd.oid});
    moveOrder(fd.id,fd.oid,fd.move==="1"?"fitting":cur.stage,false,ft).then(function(ok){if(ok)toast("Fitting saved")});
  }else if(f.dataset.form==="templates"){
    var t={shopName:String(v.get("shopName")).trim()||DEFAULT_TPL.shopName};
    TPL_KEYS.forEach(function(k){t[k]={subject:String(v.get(k+"_subject")),body:String(v.get(k+"_body"))}});
    dlg.close();saveTemplates(t).then(function(ok){if(ok)toast("Emails saved")});
  }});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){S.q=t.value;fillCustomers()}
  else if(t.dataset.seg){S.seg[t.dataset.seg]=t.type==="checkbox"?t.checked:t.value;fillEmail()}
  else if(t.id==="c-sub"||t.id==="c-body")fillPreview()});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="todo-for"){S.todoFor=t.value;lsSet("cb-todo-for",t.value);fillTodo();renderNav();return}
  if(t.dataset.assign){var ac=clone(byId(t.dataset.id));if(!ac)return;
    if(t.dataset.assign==="customer"){if(t.value)ac.owner=t.value;else delete ac.owner}
    else{var ao=orders(ac).find(function(x){return x.id===t.dataset.oid});if(!ao)return;if(t.value)ao.owner=t.value;else{delete ao.owner;if(ac.owner)ao.owner=""}}
    saveCustomer(ac).then(function(ok){if(ok)toast(t.value?"Assigned to "+staffName(t.value):"Unassigned")});return}
  if(t.dataset.map&&S.imp){S.imp.map[t.dataset.map]=Number(t.value);fillImport()}
  else if(t.id==="i-file"&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){startImport(r.result)};r.onerror=function(){toast("That file could not be read. Try pasting the rows instead.")};r.readAsText(t.files[0])}});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
boot();
})();
</script>
</body>
</html>
